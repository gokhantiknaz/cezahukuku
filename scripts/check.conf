# scripts/check.conf — ./scripts/check'in adımları (bootstrap 2026-11-11). Biçim: <ad>: <komut>; sırayla, ilk hatada durur.
# [fast] etiketli adımlar ./scripts/check --fast ile de çalışır; tam kontrol (etiketsiz) tek geçerli kanıttır.
#
# Ortak kurallar (docs/testing.md, Resource hygiene; docs/conventions.md, Known traps):
# - .NET çıktısı artifacts/check altına (gitignore'da): çalışan bir geliştirme API'sinin kilitlediği bin/ klasörüne
#   dokunulmaz (Known trap 4). Bu yüzden her .NET adımı aynı UseArtifactsOutput/ArtifactsPath değerlerini verir.
# - resource hygiene: no build servers — --disable-build-servers (MSBuild düğüm yeniden kullanımı, VBCSCompiler, Razor).
# - check izlenen dosyaları değiştirmez: OpenAPI belgesi yeniden üretilmez (-p:OpenApiGenerateDocuments=false, Known trap 3).
# - Veri: entegrasyon testleri cezahukuku_integration veritabanını her çalıştırmanın başında silip kurar (bilinen başlangıç
#   durumu); geliştirme veritabanına (cezahukuku_test) dokunmaz.

requires build: sh -c 'v=$(dotnet --version) && [ "${v%%.*}" -ge 10 ]'
requires lint: sh -c 'test -d web/node_modules && node -e "process.exit(+process.versions.node.split(\".\")[0] >= 20 ? 0 : 1)"'
requires integration: sh scripts/pg-ready

build [fast]: env UseArtifactsOutput=true ArtifactsPath="$PWD/artifacts/check" dotnet build backend/CezaHukuku.slnx --disable-build-servers -p:OpenApiGenerateDocuments=false -nologo -v:q -clp:ErrorsOnly
unit [fast]: env UseArtifactsOutput=true ArtifactsPath="$PWD/artifacts/check" dotnet test backend/tests/CezaHukuku.UnitTests --no-build --nologo
lint [fast]: cd web && npm run lint --silent
# Web'in saf mantık testleri: Node'un yerleşik test koşucusu (bağımlılık yok, spec 0003 plan A-1); süreç test bitince kapanır.
web unit [fast]: cd web && node --experimental-strip-types --test "src/**/*.test.ts"
# Next'in sayfa/rota tipleri (.next/types: PageProps, LayoutProps) temiz kopyada yoktur; tsc'den önce üretilir (derleme gerekmez).
typecheck [fast]: cd web && npx --no-install next typegen && npx --no-install tsc --noEmit
integration: env UseArtifactsOutput=true ArtifactsPath="$PWD/artifacts/check" dotnet test backend/tests/CezaHukuku.IntegrationTests --no-build --nologo
# resource hygiene: Next telemetrisi kapalı; derleme işçileri adım bitince kapanır. Geliştirme sunucusu (.next/dev) etkilenmez.
web build: cd web && NEXT_TELEMETRY_DISABLED=1 npm run build --silent
